[package]
name = "kestrel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
ego-tree = "0.11.0"
futures-util = "0.3.34"
libc = "0.2.190"
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "gzip", "brotli", "deflate", "rustls", "blocking"] }
rquickjs = { version = "0.14.0", features = ["bindgen", "loader", "classes", "properties"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "fs"] }
tokio-tungstenite = "0.30.0"
url = "2.5.8"
