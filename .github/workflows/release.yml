name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: kestrel-x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: kestrel-aarch64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            name: kestrel-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            name: kestrel-x86_64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: kestrel-x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz ksl
          cd ../../..
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.name }}.zip ksl.exe
          cd ../../..
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            kestrel-*.tar.gz
            kestrel-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release exists"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "kestrel $GITHUB_REF_NAME" --generate-notes
          fi
